name = "pixel-trichy"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# npx wrangler d1 create pixel-trichy   -> paste the database_id below
# npx wrangler d1 execute pixel-trichy --remote --file functions/schema.sql
# npx wrangler pages secret put ADMIN    -> token for the /api/admin/* endpoints
[[d1_databases]]
binding = "DB"
database_name = "pixel-trichy"
database_id = "REPLACE_WITH_D1_ID"
